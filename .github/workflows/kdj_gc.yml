name: 민주홍공부해

on:
  schedule:
    - cron: "03 11 * * 1-5"   # 한국시간 기준 월~금 낮 12:00 (UTC 03:00)
    # - cron: "30 16 * * 1-5"   # 미국 장중  (UTC 16:30)
    # - cron: "0 21 * * 1-5"    # 미국 장후  (UTC 21:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kdj-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: python kdj_gc.py

      - name: Upload result (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdj-scan-${{ github.run_id }}
          path: L2KDJ_US_B_*.xlsx
          if-no-files-found: ignore
          retention-days: 7
